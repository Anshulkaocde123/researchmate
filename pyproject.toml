[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchmate"
version = "0.1.0"
description = "Citation-grounded RAG assistant over QASPER NLP papers (fastembed + Chroma + Claude)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["rag", "nlp", "research", "citations", "qasper"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7",
    "fastembed>=0.3",          # ONNX-based BGE embeddings + cross-encoder reranker; no PyTorch
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "google-genai>=0.8",
    "gradio>=4.36",
    "datasets>=2.20",          # for QASPER download
    "python-dotenv>=1.0",
    "tenacity>=8.3",           # retry logic for API calls
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-tqdm",
]

[project.scripts]
researchmate = "researchmate.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["researchmate"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
    "integration: marks tests as integration tests (require GEMINI_API_KEY)",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/researchmate"]
omit = ["*/ui/*"]            # UI tested manually / with Playwright

[tool.coverage.report]
show_missing = true
fail_under = 0               # tighten per step as coverage grows
