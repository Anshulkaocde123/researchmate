name: CI

on:
  push:
  pull_request:

# Cancel any in-progress run for the same branch/PR when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # cache ~/.cache/pip between runs

      - name: Install project (with dev extras)
        run: pip install -e ".[dev]"

      - name: Run gate (lint + unit tests)
        run: make check
